# Builds the offline uploader into an installer a laboratory can run.
#
# This is separate from Apps CI on purpose. Apps CI proves, on every push, that
# the uploader compiles, that its de-identification is correct, and that it
# packages — but it does so on Linux, and a laboratory in Ahafo runs Windows. A
# Windows installer must be built on Windows (or under wine, which is its own
# source of surprises), so it is built here on a GitHub-hosted Windows runner.
# Nobody needs to own a Windows machine to produce one.
#
# It does not run on every push, because a Windows runner is slow and the
# correctness checks already run elsewhere. Trigger it when you actually want an
# installer:
#
#   • Actions tab → "Uploader installers" → Run workflow      (an ad-hoc build)
#   • push a tag  uploader-v0.1.0                              (a release build,
#                                                               attached to a
#                                                               GitHub Release)

name: Uploader installers

on:
  workflow_dispatch:
  push:
    tags:
      - "uploader-v*"

permissions:
  contents: write # to attach the installer to a Release on a tag

jobs:
  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: apps/uploader
        # bash, not PowerShell: the same globbing and test invocation as the
        # Linux job, so behaviour does not diverge between the two.
        shell: bash

    # Seen by every step. When a code-signing certificate is bought, add these
    # two repository secrets and every build signs itself — no change here.
    # Absent, electron-builder produces an unsigned installer, which is the
    # honest state until the certificate exists rather than a silent failure.
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/uploader/package-lock.json

      - run: npm ci

      # The installer carries where this programme's service lives, so a
      # laboratory scientist is never asked for an address. Set the repository
      # variables AMRSS_API_URL and AMRSS_WEB_URL (Settings → Secrets and
      # variables → Actions → Variables); without them the installer still works
      # and simply asks IT to fill the address in once, on the machine.
      - name: Write the deployment file
        env:
          API_URL: ${{ vars.AMRSS_API_URL }}
          WEB_URL: ${{ vars.AMRSS_WEB_URL }}
          SUPPORT_CONTACT: ${{ vars.AMRSS_SUPPORT_CONTACT }}
        run: |
          if [ -z "${API_URL}" ]; then
            echo "::warning::AMRSS_API_URL is not set, so this installer ships without a service address. Whoever installs it must set one under Connection settings."
          fi
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("deployment.json", JSON.stringify({
              apiUrl: (process.env.API_URL || "").replace(/\/+$/, ""),
              webUrl: (process.env.WEB_URL || "").replace(/\/+$/, ""),
              facilityCode: null,
              facilityName: null,
              supportContact: process.env.SUPPORT_CONTACT || null,
            }, null, 2) + "\n");
          '
          cat deployment.json

      - name: Compile
        run: npm run build

      # The one component that handles identifiable patient data. Its linkage-key
      # and output-shape tests run here too, so a Windows build can never ship
      # from a green run whose de-identification was never checked on this OS.
      - name: De-identification tests
        run: npm test

      - name: Build the NSIS installer
        # `--publish never`: the config already sets publish: null, and this makes
        # certain a build never tries to push anything outward.
        run: npx electron-builder --win nsis --publish never

      - name: The installer exists and is not a stub
        run: |
          shopt -s nullglob
          installers=(release/*.exe)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error::electron-builder produced no .exe"
            ls -la release || true
            exit 1
          fi
          for exe in "${installers[@]}"; do
            size=$(stat -c%s "$exe" 2>/dev/null || stat -f%z "$exe")
            echo "built: $exe ($size bytes)"
            # A bundled-Electron installer is tens of megabytes. Anything under
            # 20 MB is a broken build that happens to have produced a file.
            if [ "$size" -lt 20000000 ]; then
              echo "::error::$exe is implausibly small ($size bytes) — the build is broken"
              exit 1
            fi
          done
          if [ -n "${WIN_CSC_LINK}" ]; then
            echo "signed build"
          else
            echo "::warning::UNSIGNED build — no code-signing certificate is configured. Windows SmartScreen will warn on first run until one is."
          fi

      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amrss-uploader-windows
          path: apps/uploader/release/*.exe
          if-no-files-found: error
          retention-days: 30

      # On a release tag, put the installer somewhere durable and linkable rather
      # than only inside a workflow run that expires.
      - name: Attach the installer to the Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Windows installer for the offline AMRSS uploader."
          if [ -z "${WIN_CSC_LINK}" ]; then
            notes="${notes} This build is unsigned; Windows SmartScreen will warn on first run until a code-signing certificate is configured."
          fi
          gh release create "${GITHUB_REF_NAME}" release/*.exe \
            --title "AMRSS Uploader ${GITHUB_REF_NAME}" \
            --notes "${notes}" \
          || gh release upload "${GITHUB_REF_NAME}" release/*.exe --clobber
