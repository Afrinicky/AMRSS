# CI for the apps/ monorepo: the surveillance API, the offline WHONET uploader,
# and the clinician dashboard.
#
# Deliberately a separate workflow from ci.yml, which covers the root src/
# package (the CLSI interpretation and security core). Both were previously
# named ci.yml, and merging the two branches silently replaced one with the
# other — leaving apps/ with no CI at all. Separate files cannot collide that
# way, and the split also makes it obvious which suite covers which tree.

name: Apps CI

on:
  push:
    branches: ["**"]
    paths:
      - "apps/**"
      # apps/api depends on the shared CLSI engine, so a change there must
      # re-run this suite. Without it, breaking the interpretation engine would
      # show green on the API that imports it.
      - "packages/**"
      - ".github/workflows/apps.yml"
  pull_request:
    paths:
      - "apps/**"
      # apps/api depends on the shared CLSI engine, so a change there must
      # re-run this suite. Without it, breaking the interpretation engine would
      # show green on the API that imports it.
      - "packages/**"
      - ".github/workflows/apps.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Surveillance API — lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amrss
          POSTGRES_PASSWORD: amrss_dev
          POSTGRES_DB: amrss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amrss -d amrss"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      AMRSS_DATABASE_URL: postgresql+psycopg://amrss:amrss_dev@localhost:5432/amrss

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy amrss

      - name: Apply migrations
        run: uv run alembic upgrade head

      # The suite includes two structural guards that must keep passing:
      # no region name in application source (ADR-0002), and no hardcoded
      # methodology value in the analytics engine (ADR-0003). Both encode
      # architectural commitments that are easy to erode by accident.
      - name: Tests
        run: uv run pytest -q

      - name: Seed reference data and demo block
        run: uv run python -m amrss.seed

      # The bootstrap path a deployment depends on. A new installation has no
      # accounts, so if these break nobody can sign in to a fresh deployment —
      # and that is not something the test suite would notice.
      - name: Bootstrap commands
        run: |
          uv run python -m amrss.cli check-config
          uv run python -m amrss.cli gen-secret --bytes 32 > /dev/null
          uv run python -m amrss.cli list-users

  uploader:
    name: Offline uploader — de-identification tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/uploader

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/uploader/package-lock.json

      - run: npm ci

      # This is the component that handles raw patient data. Its tests cover
      # linkage-key irreversibility and the allow-list output shape.
      - run: npm test

      # Package it. The native SQLite module is rebuilt against Electron's ABI
      # here, and a mismatch does not surface until the packaged application
      # opens a database — which, without this step, would be on a laboratory
      # workstation after installation.
      - name: Package
        run: npm run package

      - name: Verify the packaged native module loads
        run: |
          cat > /tmp/probe.js <<'PROBE'
          const path = require("path");
          const Database = require(path.join(process.argv[2], "resources/app.asar/node_modules/better-sqlite3"));
          const db = new Database(":memory:");
          db.exec("create table t(x int); insert into t values (42)");
          if (db.prepare("select x from t").get().x !== 42) process.exit(1);
          console.log("packaged native module OK");
          PROBE
          ELECTRON_RUN_AS_NODE=1 ./release/linux-unpacked/amrss-uploader /tmp/probe.js "$PWD/release/linux-unpacked"

      - name: Confirm no test fixtures were packaged
        run: |
          # The WHONET fixtures exercise de-identification against realistic
          # patient-shaped records. They have no business on a clinical
          # workstation, so their absence from the package is checked, not
          # assumed.
          npx asar list release/linux-unpacked/resources/app.asar > /tmp/packaged.txt
          if grep -q "/dist/test" /tmp/packaged.txt; then
            echo "Test files were packaged:"; grep "/dist/test" /tmp/packaged.txt; exit 1
          fi
          echo "no test files in the package"

  image:
    name: API image — builds and starts against a real database
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The deployment artefact itself. Neither the test suite nor the linters
      # would notice a Dockerfile that cannot build, and the first sign would be
      # a failed release.
      - name: Build the API image
        run: docker build -f infra/docker/api.Dockerfile -t amrss-api:ci .

      # The image must carry everything it imports. A path-based install of the
      # shared CLSI engine once left a .pth file pointing at the build stage's
      # source tree: migrations ran, because Alembic does not import the engine,
      # and the app died the moment uvicorn loaded it. Checked here rather than
      # inferred from a readiness timeout two minutes later.
      - name: The image is self-contained
        run: |
          docker run --rm amrss-api:ci python -c \
            "import amrss.main, amrss.cli, amrss_clsi.interpretation; print('imports resolve inside the image')"

      # A user-defined network rather than the host's, so the database is
      # reached by service name. That is how a real deployment addresses it —
      # and `@localhost` is one of the things the production configuration check
      # refuses, correctly, as a leftover development setting.
      - name: Start PostgreSQL
        run: |
          docker network create amrss
          docker run -d --name db --network amrss \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=amrss -e POSTGRES_USER=amrss \
            postgres:16-alpine
          for _ in $(seq 30); do
            docker exec db pg_isready -U amrss -d amrss && break
            sleep 2
          done

      # Everything a deployment does on first start, in the order it does it:
      # migrate, serve, become ready, load reference data, bootstrap an account.
      # Run in production mode, because that is the mode a deployment runs in
      # and it is the only mode where the configuration checks apply.
      - name: Start the API as a deployment would
        run: |
          docker run -d --name api --network amrss -p 8000:8000 \
            -e AMRSS_DATABASE_URL='postgresql+psycopg://amrss:ci@db:5432/amrss' \
            -e AMRSS_JWT_SECRET="$(head -c 48 /dev/urandom | base64 | tr -d '\n')" \
            -e AMRSS_ENVIRONMENT=production \
            -e AMRSS_CORS_ORIGINS='[]' \
            amrss-api:ci

      - name: Wait for readiness
        run: |
          for _ in $(seq 40); do
            if curl -fsS http://localhost:8000/health/ready | grep -q '"ready"'; then
              echo "API ready"; exit 0
            fi
            sleep 3
          done
          echo "API never became ready"; docker logs api; exit 1

      # Liveness and readiness must not be the same answer, or the container
      # healthcheck is checking nothing useful.
      - name: Liveness and readiness are distinct
        run: |
          curl -fsS http://localhost:8000/health | grep -q '"ok"'
          curl -fsS http://localhost:8000/health/ready | grep -q '"ready"'

          # The base address answers, because that is what someone handed a URL
          # opens first, and a 404 there makes a working service look broken.
          curl -fsS http://localhost:8000/ | grep -q 'AMRSS Surveillance API'

      - name: Bootstrap, exactly as docs/DEPLOYMENT.md says to
        run: |
          docker exec api python -m amrss.cli check-config
          docker exec api python -m amrss.seed
          docker exec api python -m amrss.cli create-block \
            TST "Test Block" "Test Committee" --district "Test District"
          docker exec api python -m amrss.cli list-users

      - name: The demo block must refuse to load in production
        run: |
          # A production deployment must never receive known-password accounts.
          if docker exec api python -c 'from amrss.db import SessionLocal; from amrss.seed import seed_demo_block; db = SessionLocal(); seed_demo_block(db)'; then
            echo "Demo data loaded in production — refusing to pass"; exit 1
          fi
          echo "demo seed correctly refused"

      - name: The audit trail must refuse to be rewritten
        run: |
          if docker exec db psql -U amrss -d amrss -c "delete from audit_log"; then
            echo "audit_log accepted a DELETE"; exit 1
          fi
          echo "audit_log is append-only"

      # The check earns its place by refusing things, so refusing is what gets
      # tested: the published development password, and the development signing
      # key, are both configurations that would start and serve traffic.
      - name: Unsafe production configuration must be refused
        run: |
          for bad in \
            "AMRSS_DATABASE_URL=postgresql+psycopg://amrss:amrss_dev@db:5432/amrss" \
            "AMRSS_JWT_SECRET=dev-secret-not-for-production"
          do
            if docker run --rm --network amrss \
              -e AMRSS_DATABASE_URL='postgresql+psycopg://amrss:ci@db:5432/amrss' \
              -e AMRSS_JWT_SECRET="$(head -c 48 /dev/urandom | base64 | tr -d '\n')" \
              -e AMRSS_CORS_ORIGINS='[]' \
              -e AMRSS_ENVIRONMENT=production \
              -e "$bad" \
              amrss-api:ci python -m amrss.cli check-config; then
              echo "check-config accepted: $bad"; exit 1
            fi
            echo "correctly refused: ${bad%%=*}"
          done

      # A malformed URL must stop the container at its first command, not deep
      # inside the driver. This is the shape that failed a real deploy: a Neon
      # string with a second '?' appended, which lands inside the previous
      # parameter's value instead of adding a parameter.
      - name: A doubled query string must be refused by name
        run: |
          bad='postgresql+psycopg://amrss:ci@db:5432/amrss?sslmode=require&channel_binding=require?sslmode=require'
          if output=$(docker run --rm --network amrss \
            -e AMRSS_DATABASE_URL="$bad" \
            -e AMRSS_JWT_SECRET="$(head -c 48 /dev/urandom | base64 | tr -d '\n')" \
            -e AMRSS_CORS_ORIGINS='[]' \
            -e AMRSS_ENVIRONMENT=staging \
            amrss-api:ci python -m amrss.cli check-config 2>&1); then
            echo "::error::A URL with two '?' was accepted."; exit 1
          fi
          echo "$output" | grep -q "AMRSS_DATABASE_URL" \
            || { echo "::error::Refusal did not name the setting."; echo "$output"; exit 1; }
          echo "correctly refused, by name"

      # The deploy that taught us this: migrations *and* the demonstration seed
      # both ran before uvicorn bound a port, so on a fraction of a CPU nothing
      # was listening for about seven minutes. Render failed the deploy on its
      # port scan while the application was still healthily seeding.
      #
      # The seed is backgrounded now. The assertion is relative rather than a
      # stopwatch — the port must open *before the seed finishes*, which is the
      # actual invariant and does not depend on how fast this runner is.
      - name: The port opens before seeding finishes
        run: |
          docker exec db psql -U amrss -d amrss -c 'create database amrss_boot'
          docker run -d --name api-boot --network amrss -p 10000:10000 \
            -e PORT=10000 \
            -e AMRSS_DATABASE_URL='postgresql+psycopg://amrss:ci@db:5432/amrss_boot' \
            -e AMRSS_JWT_SECRET="$(head -c 48 /dev/urandom | base64 | tr -d '\n')" \
            -e AMRSS_ENVIRONMENT=staging \
            -e AMRSS_BOOTSTRAP=demo \
            -e AMRSS_CORS_ORIGINS='[]' \
            amrss-api:ci

          # PORT is honoured, not just 8000: every platform this runs on assigns
          # one, and a service that ignores it is a service that never appears.
          opened=""
          for _ in $(seq 90); do
            if curl -fsS http://localhost:10000/health | grep -q '"ok"'; then
              opened=yes; break
            fi
            sleep 1
          done
          [ -n "$opened" ] || { echo "::error::Nothing ever listened on \$PORT."; docker logs api-boot; exit 1; }

          if docker logs api-boot 2>&1 | grep -q 'synthetic regional block loaded'; then
            echo "::error::The seed finished before the port opened — it is blocking start-up again."
            docker logs api-boot; exit 1
          fi
          echo "port open while the seed is still running"

          # And the backgrounded seed must actually complete, not be lost.
          for _ in $(seq 90); do
            if docker logs api-boot 2>&1 | grep -q 'synthetic regional block loaded'; then
              echo "background seed completed"; exit 0
            fi
            sleep 2
          done
          echo "::error::The backgrounded seed never completed."; docker logs api-boot; exit 1

      - name: API logs
        if: always()
        run: docker logs api

      - name: Start-up ordering logs
        if: always()
        run: docker logs api-boot || true

  web:
    name: Dashboard — types and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # The loading fallback must not depend on JavaScript running.
      #
      # React never hydrates a Suspense fallback — it is markup standing in for a
      # subtree that has not rendered yet — so a client component placed there is
      # inert, and an effect scheduled in one never fires. The first version of
      # the "the service is waking up" notice was exactly that: it typechecked,
      # it built, and against a slow API it simply never appeared. Only running
      # it found that, so the invariant is checked here rather than remembered.
      - name: The loading fallback survives without hydration
        run: |
          if grep -q '"use client"' src/app/loading.tsx; then
            echo "::error file=apps/web/src/app/loading.tsx::A Suspense fallback is never hydrated, so it cannot be a client component."
            exit 1
          fi
          if grep -nE '^\s*import .* from "@/components/' src/app/loading.tsx; then
            echo "::error file=apps/web/src/app/loading.tsx::Imported components may be client components, whose effects never run in a fallback. Use CSS."
            exit 1
          fi
          echo "loading.tsx is server-rendered markup only"
