[build-system]
requires = ["setuptools>=83"]  # >=83 fixes PYSEC-2026-3447 (MANIFEST.in exclusion bypass)
build-backend = "setuptools.build_meta"

[project]
name = "amrss"
version = "0.1.0"
description = "Antimicrobial Resistance Surveillance System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "pyjwt>=2.8",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
# Two roots, not one. The CLSI interpretation engine lives in packages/clsi so
# that both this service and the surveillance API import the same
# implementation (ADR-0005), and it has to be installed alongside `amrss` or the
# application cannot boot — `pytest`'s pythonpath makes the tests pass while
# `import amrss.main` fails, which is the worst possible combination.
where = ["src", "packages/clsi/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "packages/clsi/src"]
filterwarnings = ["error::DeprecationWarning:amrss.*"]

[tool.ruff]
line-length = 100
src = ["src", "packages/clsi/src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "A", "C4", "RET", "SIM", "PTH"]
# S101 (assert) is fine in tests; handled per-file below.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# FastAPI's dependency-injection idiom is `x = Depends(...)` in the signature;
# B008 flags exactly that pattern and cannot be satisfied without abandoning it.
"src/amrss/api/*" = ["B008"]
# Action-name and token-type constants are identifiers, not credentials.
"src/amrss/core/audit.py" = ["S105"]
"src/amrss/schemas/auth.py" = ["S105"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]

[tool.mypy]
python_version = "3.11"
packages = ["amrss"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
