<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The renderer runs no remote code and loads no remote asset. The policy
         is stated here as well as enforced by the packaging, because a future
         change that adds a CDN font should fail loudly rather than quietly
         reach the network from a clinical workstation. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'"
    />
    <title>AMRSS Uploader</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div class="toasts" id="toasts"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
